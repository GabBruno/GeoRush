name: Rollback

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag da Release para restaurar (ex.: v1.0.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  rollback:
    name: Rollback em Produção
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Validar existência da Release alvo
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TARGET_TAG: ${{ inputs.tag }}
        run: |
          gh release view "$TARGET_TAG" > /dev/null

      - name: Promover Release anterior para Latest (sem recompilar)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TARGET_TAG: ${{ inputs.tag }}
        run: |
          gh release edit "$TARGET_TAG" --latest